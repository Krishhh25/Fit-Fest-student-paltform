<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout — Find Your Next Opportunity</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🎯 Scout</div>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="discover">Discover</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="profile">Profile</button>
    </div>
  </nav>

  <main>
    <section id="discover" class="tab-content active">
      <div class="section-header">
        <h1>Discover Opportunities</h1>
        <p>Internships, hackathons, scholarships & more — all in one place.</p>
      </div>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search by title or skill...">
        <select id="categoryFilter">
          <option value="all">All Categories</option>
        </select>
        <select id="sortFilter">
          <option value="recommended">Recommended for you</option>
          <option value="deadline">Deadline (soonest)</option>
          <option value="title">Title (A–Z)</option>
        </select>
      </div>
      <div id="opportunityGrid" class="opportunity-grid"></div>
    </section>

    <section id="dashboard" class="tab-content">
      <div class="section-header">
        <h1>Your Dashboard</h1>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="dashboard-columns">
        <div>
          <h2>⭐ Recommended for You</h2>
          <div id="recommendedList" class="opportunity-grid small"></div>
        </div>
        <div>
          <h2>🔖 Bookmarked</h2>
          <div id="bookmarkedList" class="opportunity-grid small"></div>
        </div>
      </div>
    </section>

    <section id="profile" class="tab-content">
      <div class="section-header">
        <h1>Your Profile</h1>
        <p>Tell us about yourself so we can find the best matches.</p>
      </div>
      <div id="profileSummary" class="profile-summary"></div>
      <form id="profileForm" class="profile-form">
        <label>Name
          <input type="text" id="pName" placeholder="Your name">
        </label>
        <label>Education
          <input type="text" id="pEducation" placeholder="e.g. BCA 3rd Year">
        </label>
        <label>Skills (comma separated)
          <input type="text" id="pSkills" placeholder="e.g. Python, React, SQL">
        </label>
        <fieldset>
          <legend>Interested Categories</legend>
          <div id="categoryCheckboxes" class="checkbox-grid"></div>
        </fieldset>
        <button type="submit">Save Profile</button>
      </form>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
